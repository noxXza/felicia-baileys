# ganti npm ci -> npm install

git add package-lock.json .github/workflows/publish.yml
git commit -m "fix: add lockfile only"
git push origin main

git tag v1.0.1
git push origin v1.0.1name: Publish to NPM
on:
  push:
    tags:
      - 'v*'
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci
      - run: npm publish --provenance --access public
